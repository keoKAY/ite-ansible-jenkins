---
# need to use -e "new_image=dh_acc/image:version"
- name: Deploy ReactJS Playbook 
  hosts: stag-server 
  vars: 
    project_dir: ~/Documents/reactjs-app
    #new_img: 
  tasks: 
    - name: Create Project Directory 
      file: 
        path: "{{project_dir}}"
        state: directory 
        recurse: true  
        mode: "0755"
    - name: Copy Docker Compose to project dir 
      copy: 
        src: ../vars/reactjs-compose.yaml
        dest: "{{project_dir}}/docker-compose.yaml"

    # sed vs yq 
    - name: Install yq with classic confinement
      become: true 
      community.general.snap:
        name: yq
        classic: true
        state: present 
    - name: Check New Image Name 
      debug: 
        msg: "New Image is {{new_img }}"
    - name: Update Image Name
      command: >
        yq -i '.services.reactjs-svc.image = "{{ new_img }}"' docker-compose.yaml
      args:
        chdir: "{{ project_dir }}" 
    - name: Start our service 
      command: "docker compose up -d"
      args: 
        chdir: "{{project_dir}}"

    # Config domain name + https 
    # ansible-react.akasdev.com 3004
    - name: Generate Reverse Proxy Config and HTTPS 
      become: true 
      ansible.builtin.script: ../scripts/auto-add-domain.sh 
      args:
        executable: /bin/bash  
      register: script_result

    - name: Display script output
      ansible.builtin.debug:
        var: script_result.stdout_lines
